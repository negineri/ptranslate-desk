<!doctype html>
<!-- ツールバーのボタンで開く小さい翻訳の画面 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<title>PTranslate</title>
<!-- shared-style -->
<style>
  body { width: 440px; font-size: 14px; }
  main { padding: 12px; }
  h1 { font-size: 1.05rem; margin: 0 0 8px; }
  .langs { margin-bottom: 8px; }
  #src { min-height: 110px; }
  #out { min-height: 110px; max-height: 260px; overflow-y: auto; margin-top: 8px; }
  .row { margin-top: 8px; }
  #setup p { margin: 0 0 10px; }
</style>
</head>
<body><main>
  <h1><img class="brand-mark" src="./logo.png" width="20" height="20" alt="">PTranslate<span class="spacer"></span><button id="open-web" class="link" hidden>Web版を開く</button><button id="open-options" class="link">設定</button></h1>
  <div id="setup" hidden>
    <p class="hint">はじめに拡張の設定で翻訳サーバーのURLを入れてください。</p>
    <button id="setup-options" class="primary">拡張の設定を開く</button>
  </div>
  <div id="translator" hidden>
    <div class="langs">
      <select id="target" aria-label="訳す先の言語"><option value="auto">日本語 ⇄ 英語 (自動)</option></select>
    </div>
    <textarea id="src" placeholder="訳したい文章を入れる (Ctrl+Enter ですぐ翻訳)" spellcheck="false"></textarea>
    <div id="out" aria-live="polite"></div>
    <div class="row">
      <button id="go" class="primary">翻訳する</button>
      <button id="stop" hidden>中止</button>
      <span id="status" class="hint" role="status"></span>
      <span class="spacer"></span>
      <button id="login" hidden>ログイン</button>
      <button id="copy" disabled>訳をコピー</button>
    </div>
    <p class="hint">ページで文を選んで右クリック →「PTranslate で翻訳」でも訳せます。<span id="shortcut"></span></p>
  </div>
</main><script type="module" src="./action.mjs"></script></body>
</html>
