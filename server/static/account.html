<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マイページ · PTranslate</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="/account.css">
<script type="module" src="/account.mjs"></script>
</head>
<body>
<main id="account">
  <nav aria-label="ページ"><a href="/">翻訳</a><a href="/ranking">ランキング</a></nav>
  <h1>マイページ</h1>
  <p id="status" role="status">読み込み中…</p>
  <div id="account-content" hidden>
    <section>
      <h2>貢献量</h2>
      <div class="table">
        <table>
          <thead><tr><th scope="col">期間</th><th scope="col">推定トークン数</th><th scope="col">配信件数</th><th scope="col">参加日数</th></tr></thead>
          <tbody id="contribution"></tbody>
        </table>
      </div>
    </section>
    <section>
      <h2>登録したワーカー</h2>
      <ul id="workers"></ul>
      <p id="terms"></p>
    </section>
    <section>
      <h2>ランキングへの掲載</h2>
      <form id="listing">
        <label>掲載方法
          <select id="listing-mode">
            <option value="hidden">掲載しない</option>
            <option value="username">ユーザー名で掲載する</option>
            <option value="nickname">ニックネームで掲載する</option>
          </select>
        </label>
        <label id="nickname-label" hidden>ニックネーム <input id="nickname" type="text" maxlength="40"></label>
        <button>保存</button>
      </form>
      <p id="listing-status" role="status"></p>
    </section>
    <section id="account-actions" hidden>
      <h2>アカウントの操作</h2>
      <nav id="links" aria-label="アカウントの操作"></nav>
    </section>
  </div>
</main>
</body>
</html>
