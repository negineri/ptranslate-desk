[package]
name = "ptranslate-desk"
version = "0.1.0"
edition = "2021"

[features]
smoke-test = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tempfile = "3"
