[package]
name = "ptranslate-worker"
version = "0.0.0-dev"
edition = "2021"
publish = false

[dependencies]
ptranslate-core = { path = "../core" }

[target.'cfg(target_os = "linux")'.dependencies]
base64 = "0.22"
getrandom = "0.3"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["time", "net", "io-util", "sync", "macros", "rt-multi-thread", "process", "signal"] }
zeroize = "1"
