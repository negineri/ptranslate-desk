<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PTranslate Desk — 選んだ文を翻訳</title>
<link rel="icon" href="./favicon.ico" sizes="any">
<!-- shared-style -->
<style>
  html, body { height: 100%; overflow: hidden; }
  main { padding: 14px; height: 100%; display: flex; flex-direction: column; }
  .heading, #status, .row { flex-shrink: 0; }
  .heading { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  #direction { flex: 1; font-size: .9rem; color: var(--muted); }
  #out { min-height: 0; flex: 1; overflow-y: auto; background: var(--panel); }
  #translation:empty::before { content: "ここに訳が出ます"; color: var(--muted); }
  #status { margin-top: 6px; }
  .row { justify-content: flex-end; }
</style>
</head>
<body><main>
  <div class="heading"><img class="brand-mark" src="./logo.png" width="24" height="24" alt=""><span id="direction">選んだ文を翻訳</span><button id="close" aria-label="閉じる">閉じる</button></div>
  <div id="out" aria-live="polite"><div id="translation"></div></div>
  <div id="status" class="hint" role="status"></div>
  <div class="row"><button id="copy" disabled>コピー</button><button id="open-main">メインウィンドウで開く</button></div>
</main><script type="module" src="./popup.mjs"></script></body>
</html>
