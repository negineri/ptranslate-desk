name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install ruff==0.17.3
      - run: ruff format --check --diff server tools
      - run: python -m unittest discover -s server/tests -v
      - run: node --test server/tests/test_translation.mjs

  desktop-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check
      - run: python3 tools/run_desktop_mock.py --smoke-test
      - run: npm ci
        working-directory: desktop
      - run: npm run build -- --bundles app
        working-directory: desktop
      # アプリ内の実行権限とシンボリックリンクを保つ。
      - run: ditto -c -k --sequesterRsrc --keepParent 'src-tauri/target/release/bundle/macos/翻訳.app' macos-app.zip
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: desktop/macos-app.zip
          if-no-files-found: error

  image:
    needs: server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # PR と main ではビルドだけ。v* のタグで GHCR に出す
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
