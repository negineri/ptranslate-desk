name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python3 tools/check_release_version.py --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

  server:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: pip install ruff==0.17.3
      - run: ruff format --check --diff server tools
      - run: python -m unittest discover -s server/tests -v
      - run: node --test server/tests/test_translation.mjs

  desktop-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop/src-tauri
      - run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check
      - run: node desktop/build.mjs
      - run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
      - run: python tools/run_desktop_mock.py --smoke-test
      - run: npm ci
        working-directory: desktop
      - run: npm run tauri -- build --ci -- --locked
        working-directory: desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  desktop-macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop/src-tauri
          # mainで保存したキャッシュを、タグのリリースジョブからも復元する。
          shared-key: macos-universal
      - run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check
      - run: node desktop/build.mjs
      - run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
      - run: python3 tools/run_desktop_mock.py --smoke-test
      - run: python3 tools/macos_signing.py self-test
        timeout-minutes: 5
      - run: npm ci
        working-directory: desktop
      # CIでは最適化したビルドも確認し、配布用の依存キャッシュをmainに保存する。
      - run: npm run tauri -- build --target universal-apple-darwin --bundles app
        working-directory: desktop
      - run: codesign --verify --deep --strict --verbose=2 'src-tauri/target/universal-apple-darwin/release/bundle/macos/PTranslate Desk.app'
        working-directory: desktop
      - run: lipo 'src-tauri/target/universal-apple-darwin/release/bundle/macos/PTranslate Desk.app/Contents/MacOS/ptranslate-desk' -verify_arch arm64 x86_64
        working-directory: desktop
      # アプリ内の実行権限とシンボリックリンクを保つ。
      - run: ditto -c -k --sequesterRsrc --keepParent 'src-tauri/target/universal-apple-darwin/release/bundle/macos/PTranslate Desk.app' macos-app.zip
        working-directory: desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-app
          path: desktop/macos-app.zip
          if-no-files-found: error

  desktop-release-build:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [desktop-macos, image]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: mainに含まれる配布タグを確認
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          python3 tools/check_release_version.py --tag "$RELEASE_TAG" --write-config desktop/src-tauri/gen/release-version.json
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop/src-tauri
          shared-key: macos-universal
          save-if: "false"
      - run: npm ci
        working-directory: desktop
      # 秘密鍵なしでビルドする。更新アーカイブは署名後に作る。
      - run: npm run tauri -- build --ci --target universal-apple-darwin --bundles app --config src-tauri/gen/release-version.json --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked
        working-directory: desktop
      - run: ditto -c -k --keepParent 'src-tauri/target/universal-apple-darwin/release/bundle/macos/PTranslate Desk.app' release-app.zip
        working-directory: desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-app
          path: desktop/release-app.zip
          if-no-files-found: error
          retention-days: 1

  desktop-windows-release-build:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [desktop-windows, image]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: mainに含まれる配布タグを確認
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          python tools/check_release_version.py --tag "$RELEASE_TAG" --write-config desktop/src-tauri/gen/release-version.json
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop/src-tauri
          save-if: "false"
      - run: npm ci
        working-directory: desktop
      # コード署名なし。更新用署名は別の新しいランナーで付ける。
      - run: npm run tauri -- build --ci --config src-tauri/gen/release-version.json --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked
        working-directory: desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 1

  desktop-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [desktop-release-build, desktop-windows-release-build]
    runs-on: macos-latest
    environment: release-signing
    permissions:
      contents: write
    concurrency:
      group: desktop-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: mainに含まれる配布タグを再確認
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          python3 tools/check_release_version.py --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      # 署名ジョブはCargo・共有キャッシュ・npm lifecycle scriptを使わない。
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: desktop
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-app
          path: ${{ runner.temp }}/release-input
      - name: ビルド成果物を検査して展開
        run: python3 tools/package_macos_release.py prepare --directory "$RUNNER_TEMP/ptranslate-release" --archive "$RUNNER_TEMP/release-input/release-app.zip" --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: アプリへ署名して鍵を削除
        run: python3 tools/macos_signing.py sign --directory "$RUNNER_TEMP/ptranslate-signing" --app "$RUNNER_TEMP/ptranslate-release/PTranslate Desk.app"
        env:
          MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
      - name: dmgと更新アーカイブを作成
        run: python3 tools/package_macos_release.py package --directory "$RUNNER_TEMP/ptranslate-release" --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release-installer
          path: ${{ runner.temp }}/windows-release-input
      - name: Windowsインストーラーを検査して配布名へ揃える
        run: python3 tools/package_macos_release.py prepare-windows --directory "$RUNNER_TEMP/ptranslate-release" --archive "$RUNNER_TEMP/windows-release-input" --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: 更新アーカイブだけに署名
        run: python3 tools/package_macos_release.py sign-update --directory "$RUNNER_TEMP/ptranslate-release" --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Windowsインストーラーに更新用署名を付ける
        run: python3 tools/package_macos_release.py sign-windows --directory "$RUNNER_TEMP/ptranslate-release" --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: 更新署名の検証に使うOpenSSLを選ぶ
        run: |
          updater_openssl_prefix="$(brew --prefix openssl@3)"
          test -x "$updater_openssl_prefix/bin/openssl"
          echo "$updater_openssl_prefix/bin" >> "$GITHUB_PATH"
      - name: 更新manifestを検査
        run: python3 tools/package_macos_release.py manifest --require-windows --directory "$RUNNER_TEMP/ptranslate-release" --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: 署名用一時ファイルを削除
        if: always()
        run: python3 tools/macos_signing.py cleanup --directory "$RUNNER_TEMP/ptranslate-signing"
      - name: 検証済みのReleaseを公開
        run: |
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "PTranslate Desk $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md "${args[@]}" "$RUNNER_TEMP/ptranslate-release/output/"*
          gh release edit "$RELEASE_TAG" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}

  image:
    needs: server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # PR と main ではビルドだけ。v* のタグで GHCR に出す
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
